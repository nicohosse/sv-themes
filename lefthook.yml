pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,svelte}"
      run: bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    check-scss:
      glob: "*.scss"
      run: bun stylelint --fix {staged_files} && bun prettier --write {staged_files}
      stage_fixed: true